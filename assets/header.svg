<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Wijak Manoprang — AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fade { opacity: 0; animation: in 1s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.2s } .d4 { animation-delay: 1.7s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(340px) } }
      .node { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 50% { transform: scale(1.6); opacity: .5 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.6"/>
  <circle cx="930" cy="160" r="220" fill="url(#glow)"/>
  <rect class="scan" x="0" y="0" width="1200" height="40" fill="#22d3ee" opacity="0.04"/>

  <!-- left: text -->
  <g class="mono fade d1">
    <text x="64" y="84" fill="#22d3ee" font-size="16" letter-spacing="3">AI ENGINEER · BANGKOK</text>
  </g>
  <g class="sans fade d2">
    <text x="62" y="152" fill="url(#title)" font-size="62" font-weight="800">Wijak Manoprang</text>
  </g>
  <g class="sans fade d3" fill="#9ca3af" font-size="19">
    <text x="64" y="196">Production agentic AI — multi-agent systems, RAG,</text>
    <text x="64" y="224">MCP tool orchestration, self-hosted on-prem.</text>
  </g>
  <g class="mono fade d4" font-size="15">
    <text x="64" y="272" fill="#6b7280">$ <tspan fill="#e5e7eb">whoami</tspan> <tspan fill="#a78bfa">--now</tspan> <tspan fill="#e5e7eb">NTI · Mind AI in production</tspan><tspan class="cursor" fill="#22d3ee">▋</tspan></text>
  </g>

  <!-- right: agent graph -->
  <g transform="translate(930 160)" stroke-linecap="round">
    <g stroke="#334155" stroke-width="1.5" fill="none">
      <path id="e0" d="M0 0 L-150 -90"/><path id="e1" d="M0 0 L-170 20"/><path id="e2" d="M0 0 L-110 105"/>
      <path id="e3" d="M0 0 L40 -120"/><path id="e4" d="M0 0 L150 -80"/><path id="e5" d="M0 0 L175 30"/>
      <path id="e6" d="M0 0 L90 115"/>
      <path d="M-150 -90 L40 -120 M150 -80 L175 30 M90 115 L-110 105" stroke="#1e293b" stroke-dasharray="4 6"/>
    </g>
    <g fill="#22d3ee">
      <circle r="3"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e0"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.6s" begin=".3s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.0s" begin=".6s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.4s" begin=".9s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.1s" begin=".2s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.7s" begin=".5s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.3s" begin=".8s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
    </g>
    <g fill="#a78bfa">
      <circle class="node" cx="-150" cy="-90" r="6"/>
      <circle class="node" cx="-170" cy="20" r="5" style="animation-delay:.4s"/>
      <circle class="node" cx="-110" cy="105" r="6" style="animation-delay:.8s"/>
      <circle class="node" cx="40" cy="-120" r="5" style="animation-delay:1.2s"/>
      <circle class="node" cx="150" cy="-80" r="6" style="animation-delay:1.6s"/>
      <circle class="node" cx="175" cy="30" r="5" style="animation-delay:2s"/>
      <circle class="node" cx="90" cy="115" r="6" style="animation-delay:.6s"/>
    </g>
    <circle r="34" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
    <circle r="34" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="34;60" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" y="5" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">agent</text>
  </g>
</svg>
